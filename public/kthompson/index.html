.pv{font-size:11px;letter-spacing:.08em;text-align:center;padding:8px 16px;background:rgba(0,0,0,.45);color:var(--muted);border-bottom:1px solid var(--line)}
.pv b{color:#fff;font-weight:500}
main{display:flex;justify-content:center;padding:40px 16px 56px}
.card{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:170px;margin:4px 0 30px;filter:none}
.name{margin:0;font-size:34px;font-weight:300;letter-spacing:-.02em}
.title{margin:8px 0 0;font-size:15px;color:var(--soft)}
.co{margin:6px 0 0;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.actions{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:30px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:999px;font-size:15px;font-weight:500;text-decoration:none;cursor:pointer;border:0;font-family:inherit}
.primary{background:#fff;color:#0A0A0B}
.ghost{background:rgba(255,255,255,.06);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
dl{width:100%;margin:30px 0 0;padding:0;border-top:1px solid var(--line)}
dl div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid var(--line);font-size:14.5px}
dt{color:var(--muted)}dd{margin:0;min-width:0;overflow-wrap:anywhere;text-align:right}
dd a{color:#fff;text-decoration:none}
.lock{margin-top:34px;display:flex;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.lock b{font-family:Montserrat,Inter,sans-serif;font-weight:500;font-size:13px;letter-spacing:.08em;color:#fff}
.lock i{width:1px;height:14px;background:currentColor;opacity:.6}
